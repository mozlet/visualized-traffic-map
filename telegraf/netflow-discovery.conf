# Discovery config: receive OPNsense NetFlow v9 on u0:2055 and dump JSON
# lines so we can inspect telegraf's actual field names before wiring the
# ingestor. Run as a user process (no sudo needed; UDP 2055 is unprivileged):
#   telegraf --config telegraf/netflow-discovery.conf
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000

[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "netflow v9"

[[outputs.file]]
  files = ["/tmp/netflow-sample.jsonl"]
  data_format = "json"
  json_timestamp_units = "1ms"
