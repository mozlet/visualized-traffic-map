# Production: receive OPNsense NetFlow v9 on u0:2055, emit JSON lines to stdout
# so it can be piped into the ingestor:
#   telegraf --config telegraf/netflow.conf | INGEST_SOURCE=telegraf ./target/release/ingestor
[agent]
  interval = "5s"
  flush_interval = "1s"
  omit_hostname = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  quiet = true

[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "netflow v9"

[[outputs.file]]
  files = ["stdout"]
  data_format = "json"
  json_timestamp_units = "1ms"
