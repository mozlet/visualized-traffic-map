services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: opn-flowmap-pg
    # always (not unless-stopped): podman-restart.service only boot-starts
    # containers with restart-policy=always (rootless, linger enabled).
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-flowmap}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flowmap}
      POSTGRES_DB: ${PG_DB:-flowmap}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-flowmap} -d ${PG_DB:-flowmap}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: opn-flowmap-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
