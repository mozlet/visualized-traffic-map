[workspace]
resolver = "2"
members = ["crates/flowd-parse", "crates/ingestor", "crates/geoip", "crates/api", "crates/geo-doctor", "crates/mtr-worker", "crates/sni-sniff", "crates/fetch-hubs"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
