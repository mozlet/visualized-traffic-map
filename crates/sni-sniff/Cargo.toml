[package]
name = "sni-sniff"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Parses a pcap stream (from OPNsense tcpdump over ssh) and extracts TLS ClientHello SNI per connection"

[lib]
name = "sni_sniff"
path = "src/lib.rs"

[[bin]]
name = "sni-sniff"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
